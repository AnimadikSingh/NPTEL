<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPTEL MIS Official Assignments PDF (Weeks 1 to 12 &bull; 39 Pages)</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .pdf-topbar {
            background-color: #0f172a;
            color: #ffffff;
            padding: 0.65rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 50;
        }
        .pdf-frame-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #334155;
        }
        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        .jump-box {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background-color: #1e293b;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid #334155;
            font-size: 0.82rem;
        }
        .page-input {
            width: 50px;
            padding: 0.2rem 0.4rem;
            text-align: center;
            background-color: #0f172a;
            color: #fbbf24;
            border: 1px solid #475569;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-weight: 700;
        }
        .week-select {
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 0.25rem 0.6rem;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- PDF Viewer Top Bar -->
    <header class="pdf-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="/" style="display: inline-flex; align-items: center; gap: 0.4rem; color: #38bdf8; font-weight: 700; font-size: 0.85rem; text-decoration: none;">
                &larr; Back to Dashboard
            </a>
            <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
            <div>
                <span style="font-weight: 800; font-size: 0.95rem; color: #ffffff;">NPTEL MIS Assignments (Weeks 1 to 12)</span>
                <span style="font-size: 0.75rem; color: #94a3b8; margin-left: 0.5rem; font-family: var(--font-mono);">(39 Pages &bull; 120 Official MCQs & Answers)</span>
            </div>
        </div>

        <!-- Jump to Week & Page Controller -->
        <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
            <div class="jump-box">
                <span style="color: #94a3b8;">Jump to Week:</span>
                <select id="week-jump-select" class="week-select" onchange="jumpToWeek(this.value)">
                    <option value="1">Week 1 (Page 1)</option>
                    <option value="4">Week 2 (Page 4)</option>
                    <option value="7">Week 3 (Page 7)</option>
                    <option value="10">Week 4 (Page 10)</option>
                    <option value="13">Week 5 (Page 13)</option>
                    <option value="16">Week 6 (Page 16)</option>
                    <option value="19">Week 7 (Page 19)</option>
                    <option value="22">Week 8 (Page 22)</option>
                    <option value="25">Week 9 (Page 25)</option>
                    <option value="29">Week 10 (Page 29)</option>
                    <option value="32">Week 11 (Page 32)</option>
                    <option value="36">Week 12 (Page 36)</option>
                </select>
            </div>

            <div class="jump-box">
                <span style="color: #94a3b8;">Page:</span>
                <input type="number" id="page-jump-input" class="page-input" min="1" max="39" value="1" onkeydown="if(event.key==='Enter') jumpToPage(this.value)">
                <span style="color: #94a3b8;">/ 39</span>
                <button type="button" class="action-btn-sm" style="background:#2563eb; color:#fff;" onclick="jumpToPage(document.getElementById('page-jump-input').value)">Go</button>
            </div>

            <a href="/assignments.html" class="nav-link-btn" style="background: rgba(255,255,255,0.1); color: #fff;">
                <span>📝 View Questions & Solutions</span>
            </a>

            <a href="/assignment-practice.html" class="nav-link-btn" style="background: #10b981; color: #fff;">
                <span>🎯 Practice Mode</span>
            </a>

            <a href="/NPTEL_MIS_Assignments_Week_1_to_12.pdf" download="NPTEL_MIS_Assignments_Week_1_to_12.pdf" class="nav-link-btn btn-mock-top">
                <span>⬇ Download PDF (1.8 MB)</span>
            </a>
        </div>
    </header>

    <!-- PDF Embed Container -->
    <main class="pdf-frame-wrapper">
        <iframe id="pdf-viewer-frame" class="pdf-frame" src="/NPTEL_MIS_Assignments_Week_1_to_12.pdf#page=1&view=FitH"></iframe>
    </main>

    <script>
        function getUrlPage() {
            const params = new URLSearchParams(window.location.search);
            const p = parseInt(params.get('page'));
            if (p && p >= 1 && p <= 39) return p;
            
            const hash = window.location.hash;
            if (hash && hash.includes('page=')) {
                const match = hash.match(/page=(\d+)/);
                if (match && match[1]) {
                    const parsed = parseInt(match[1]);
                    if (parsed >= 1 && parsed <= 39) return parsed;
                }
            }
            return 1;
        }

        function jumpToPage(pageNum) {
            pageNum = parseInt(pageNum);
            if (isNaN(pageNum) || pageNum < 1) pageNum = 1;
            if (pageNum > 39) pageNum = 39;

            document.getElementById('page-jump-input').value = pageNum;
            const iframe = document.getElementById('pdf-viewer-frame');
            iframe.src = '/NPTEL_MIS_Assignments_Week_1_to_12.pdf#page=' + pageNum + '&view=FitH';

            // Sync select if match
            const select = document.getElementById('week-jump-select');
            for (let i = 0; i < select.options.length; i++) {
                if (parseInt(select.options[i].value) <= pageNum) {
                    select.selectedIndex = i;
                }
            }

            const url = new URL(window.location);
            url.searchParams.set('page', pageNum);
            window.history.replaceState({}, '', url);
        }

        function jumpToWeek(startPage) {
            jumpToPage(startPage);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const targetPage = getUrlPage();
            jumpToPage(targetPage);
        });
    </script>
</body>
</html>
